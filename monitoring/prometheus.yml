global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: chat-server
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - server
        type: A
        port: 3000
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
