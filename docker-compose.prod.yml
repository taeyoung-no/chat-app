services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - VITE_API_URL=https://localhost:8443
    container_name: chat-nginx-prod
    ports:
      - "8443:443"
    depends_on:
      - server
    restart: unless-stopped
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env.prod
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: chat-mongo-prod
    volumes:
      - mongo-data-prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: chat-redis-prod
    volumes:
      - redis-data-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo-data-prod:
  redis-data-prod:
