name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Test server
        run: npm test --workspace=server
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Build server
        run: npm run build --workspace=server

      - name: Build client
        run: npm run build --workspace=client
        env:
          VITE_API_URL: https://chat.taeyoung-no.com
